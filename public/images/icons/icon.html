@switch (name) {
  @case ('house') {
    <svg lucideHouse class="icon"></svg>
  }
  @case ('courses') {
    <svg lucideBook class="icon"></svg>
  }
  @case ('disciplines') {
    <svg lucideNotebookText class="iscon"></svg>
  }
  @case ('contents') {
    <svg lucideFileText class="icon"></svg>
  }
  @case ('events') {
    <svg lucideCalendar class="icon"></svg>
  }
  @case ('opportunities') {
    <svg lucideBriefcase class="icon"></svg>
  }
  @case ('profile') {
    <svg lucideUser class="icon"></svg>
  }
  @case ('settings') {
    <svg lucideSettings class="icon"></svg>
  }
  @default {
    <svg lucideShieldQuestion class="icon"></svg>
  }
}
