<header class="header">
  <select (change)="changeActiveInstitution($event)">
    @for(i of context.institutions(); track i.institution.id) {
      <option [value]="i.institution.id">
        {{ i.institution.nome }}
      </option>
    }
  </select>

  <div class="header__actions">
    <button>🔔</button>
    <button>👤</button>
  </div>
</header>
